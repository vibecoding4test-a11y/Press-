<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المرصد — اقرأ صحف العالم مترجمة إلى العربية</title>
<meta name="description" content="المرصد: أرسل رابط أي خبر إلى خادمك، فيُستخرج المقال ويُترجم إلى العربية ويُعرض داخل الموقع — بلا نوافذ iframe ولا حجب X-Frame-Options.">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="assets/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230f766e' stroke-width='1.8'%3E%3Ccircle cx='12' cy='12' r='9'/%3E%3Cpath d='M3 12h18M12 3c2.6 2.7 2.6 15.3 0 18M12 3c-2.6 2.7-2.6 15.3 0 18'/%3E%3C/svg%3E">
</head>
<body>
<!-- ======================= الشريط العلوي ======================= -->
<header id="topbar">
  <button class="tbtn icon" id="menuBtn" aria-label="إظهار قائمة الصحف" title="إظهار/إخفاء القائمة">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.7 2.6 15.3 0 18M12 3c-2.6 2.7-2.6 15.3 0 18"/>
    </svg>
    <span><b>المرصد</b><small id="tagline">صحافة العالم مترجمة إلى العربية</small></span>
  </div>
  <div class="top-spacer"></div>
  <div id="srvbadge" title="حالة خادم الاستخراج">
    <span class="pulse" id="srvdot"></span><span id="srvtext">جارٍ فحص الخادم…</span>
  </div>
  <button class="tbtn icon" id="sideBtn" aria-label="تغيير جهة القائمة" title="جهة القائمة: يسار/يمين">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
  </button>
  <button class="tbtn icon" id="themeBtn" aria-label="الوضع الليلي" title="الوضع الليلي/النهاري">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/></svg>
  </button>
  <button class="tbtn icon" id="settingsBtn" aria-label="إعدادات الخادم" title="إعدادات الخادم والترجمة">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 4.1V4a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 11h.1a2 2 0 1 1 0 4H21z"/></svg>
  </button>
  <button class="tbtn icon" id="helpBtn" aria-label="كيف يعمل" title="كيف يعمل المرصد؟">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.4 2.3c-.6.3-.9.8-.9 1.5v.4"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>
  </button>
</header>

<!-- ======================= النوافذ الثلاث ======================= -->
<div id="layout">
  <!-- ① قائمة الصحف -->
  <aside id="sidebar" class="pane" aria-label="قائمة الصحف">
    <div class="search" id="searchwrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="ابحث عن صحيفة أو دولة…  (اضغط /)" aria-label="بحث في الصحف">
      <button class="clr" id="qclr" aria-label="مسح البحث">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="تصفية المصادر">
      <button class="chip on" data-f="free">مجانية <span class="n" id="n-free"></span></button>
      <button class="chip" data-f="embed">سهلة الاستخراج <span class="n" id="n-embed"></span></button>
      <button class="chip" data-f="all">كل المصادر <span class="n" id="n-all"></span></button>
      <button class="chip" data-f="fav">★ مفضلتي <span class="n" id="n-fav">0</span></button>
    </div>
    <div class="body" id="listbody"></div>
    <div class="sidefoot" id="sidefoot">
      <span id="sf-count"></span> · <button id="aboutLink" class="linkish">كيف يعمل</button>
    </div>
  </aside>
  <div class="split" id="split1" role="separator" aria-orientation="vertical" aria-label="تغيير عرض القائمة" title="اسحب لتغيير العرض"></div>

  <!-- ② نافذة القراءة -->
  <main id="viewer" class="pane" aria-label="نافذة القراءة">
    <form class="ingest" id="ingestForm" autocomplete="off">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/></svg>
      <input id="urlInput" type="url" inputmode="url" dir="ltr" placeholder="الصق رابط خبر من أي صحيفة… https://"
             aria-label="رابط الخبر" spellcheck="false">
      <button class="ingest-go" id="urlGo" type="submit">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 12h15"/><path d="m13 6 6 6-6 6"/></svg>
        <span>استخرج</span>
      </button>
    </form>

    <div class="toolbar">
      <button class="ghost icon" id="backBtn" title="رجوع إلى قائمة الأخبار" aria-label="رجوع" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 12H5"/><path d="m11 18-6-6 6-6"/></svg>
      </button>
      <div class="title" id="vtitle"><b>لم تختر صحيفة بعد</b></div>
      <span class="state unknown" id="vstate">—</span>
      <button class="ghost icon" id="trBtn" title="ترجم الخبر إلى العربية">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 5h9M8 3v2c0 4-2 7-5 9"/><path d="M6 12c1.5 3 4 5 7 6"/><path d="m13 20 3.5-8 3.5 8M14.5 17h5"/></svg>
      </button>
      <button class="ghost icon" id="reloadBtn" title="إعادة الجلب من الخادم (تجاهل الذاكرة المؤقتة)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg>
      </button>
      <a class="ghost icon" id="openExt" href="#" target="_blank" rel="noopener noreferrer" title="فتح الخبر عند الناشر" aria-label="فتح المصدر الأصلي">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg>
      </a>
    </div>
    <div class="body" id="stage" aria-live="polite"></div>
  </main>
  <div class="split" id="split2" role="separator" aria-orientation="vertical" aria-label="تغيير عرض الترجمة" title="اسحب لتغيير العرض"></div>

  <!-- ③ نافذة الترجمة -->
  <section id="trans" class="pane" aria-label="نافذة الترجمة">
    <div class="toolbar">
      <div class="title"><b>الترجمة العربية</b><span class="url" id="tsrc"></span></div>
      <button class="ghost soft" id="trGoBtn" title="ترجمة الخبر (t)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 5h9M8 3v2c0 4-2 7-5 9"/><path d="M6 12c1.5 3 4 5 7 6"/><path d="m13 20 3.5-8 3.5 8M14.5 17h5"/></svg>
        <span>ترجم</span>
      </button>
      <button class="ghost icon" id="biBtn" title="إظهار النص الأصلي تحت الترجمة (b)" aria-label="نص أصلي">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 4v16"/><path d="M4 7h5M6.5 7c0 3-1 5-2.5 6M4.5 13c1.2 2 2.6 3.3 4 4"/><path d="M14 17h6M17 7v10"/></svg>
      </button>
      <button class="ghost icon" id="fontUp" title="تكبير الخط" aria-label="تكبير الخط">أ+</button>
      <button class="ghost icon" id="fontDn" title="تصغير الخط" aria-label="تصغير الخط">أ-</button>
      <button class="ghost icon" id="copyBtn" title="نسخ الترجمة" aria-label="نسخ">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
      </button>
      <button class="ghost icon" id="printBtn" title="طباعة / حفظ PDF" aria-label="طباعة">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 9V4h10v5"/><rect x="4" y="9" width="16" height="7" rx="2"/><path d="M7 16h10v4H7z"/></svg>
      </button>
    </div>
    <div class="body" id="tstage" aria-live="polite"></div>
  </section>
</div>

<div id="scrim"></div>
<div id="mtabs">
  <button class="ghost on" id="tabView">الخبر</button>
  <button class="ghost" id="tabTrans">الترجمة</button>
</div>
<div class="toast" id="toast" role="status"></div>
<noscript>
  <div class="card" style="margin:24px auto">
    <h3>جافاسكربت معطّل</h3>
    <p>يحتاج المرصد إلى تفعيل جافاسكربت لعرض قائمة الصحف وقراءة المقالات المترجمة.</p>
  </div>
</noscript>

<script src="assets/papers.js"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
