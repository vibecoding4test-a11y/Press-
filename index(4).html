<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صحافة العالم — اقرأ صحف العالم مترجمة إلى العربية</title>
<meta name="description" content="واجهة واحدة لقراءة الصحف والمواقع الإخبارية المجانية حول العالم مع ترجمة فورية إلى العربية.">
<style>
/* ============ الأساسيات ============ */
:root{
  --bg:#f5f6f8; --panel:#fff; --panel2:#fbfbfc; --line:#e4e7eb; --line2:#eef1f4;
  --ink:#101418; --ink2:#3c4550; --muted:#727d8a; --accent:#0f766e; --accent2:#0b5d57;
  --accent-soft:#e8f5f3; --ok:#15803d; --ok-soft:#e8f6ec; --warn:#b45309; --warn-soft:#fdf3e6;
  --bad:#b91c1c; --bad-soft:#fdeaea; --shadow:0 1px 2px rgba(16,20,24,.05), 0 8px 24px rgba(16,20,24,.05);
  --r:12px; --r-sm:8px; --sb:290px; --tr:470px; --read:1.02rem;
  --font:"Noto Kufi Arabic","Segoe UI","Dubai",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;
  --font-read:"Noto Naskh Arabic","Amiri","Sakkal Majalla",Georgia,serif;
}
html[data-theme="dark"]{
  --bg:#0e1114; --panel:#151a1f; --panel2:#12171b; --line:#242b33; --line2:#1d232a;
  --ink:#e9ecef; --ink2:#c6ccd3; --muted:#8f99a4; --accent:#2dd4bf; --accent2:#5eead4;
  --accent-soft:#112b28; --ok:#4ade80; --ok-soft:#12271a; --warn:#fbbf24; --warn-soft:#2a2213;
  --bad:#f87171; --bad-soft:#2b1616; --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%;
  display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--muted) 35%,transparent);border-radius:20px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--muted) 55%,transparent);background-clip:content-box}
.hidden{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ============ الشريط العلوي ============ */
#topbar{
  display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);
  border-bottom:1px solid var(--line);flex:0 0 auto;min-height:56px;z-index:30;
}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand svg{flex:0 0 auto;color:var(--accent)}
.brand b{font-size:1.06rem;font-weight:700;letter-spacing:-.2px;white-space:nowrap}
.brand small{color:var(--muted);font-size:.76rem;display:block;margin-top:-3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-spacer{flex:1}
.tbtn{
  display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border:1px solid var(--line);
  border-radius:var(--r-sm);color:var(--ink2);background:var(--panel);white-space:nowrap;font-size:.85rem;
  transition:background .15s,border-color .15s;
}
.tbtn:hover{background:var(--panel2);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.tbtn.icon{width:34px;padding:0;justify-content:center}
.tbtn.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,var(--line));color:var(--accent2)}
#srvbadge{font-size:.76rem;color:var(--muted);display:flex;align-items:center;gap:6px;padding:0 4px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:0 0 auto}
.pulse.on{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}

/* ============ التخطيط ثلاثي النوافذ ============ */
#layout{flex:1;display:flex;min-height:0;direction:ltr}
html[data-side="right"] #layout{direction:rtl}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0;direction:rtl;background:var(--panel)}
#sidebar{flex:0 0 var(--sb);width:var(--sb);border-inline-end:1px solid var(--line);background:var(--panel2)}
#viewer{flex:1 1 auto;background:var(--bg)}
#trans{flex:0 0 var(--tr);width:var(--tr);border-inline-start:1px solid var(--line)}
.split{flex:0 0 6px;cursor:col-resize;background:transparent;position:relative;z-index:5}
.split::after{content:"";position:absolute;inset:0 2px;background:transparent;transition:background .15s}
.split:hover::after,.split.drag::after{background:color-mix(in srgb,var(--accent) 45%,transparent)}

.panehead{
  display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);
  background:var(--panel);min-height:50px;flex:0 0 auto;
}
.panehead h2{margin:0;font-size:.92rem;font-weight:700;display:flex;align-items:center;gap:7px;min-width:0}
.panehead h2 .sub{font-weight:400;color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panehead .sp{flex:1}
.ghost{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;min-width:32px;padding:0 9px;
  border:1px solid transparent;border-radius:var(--r-sm);color:var(--ink2);font-size:.83rem;
}
.ghost:hover{background:var(--panel2);border-color:var(--line)}
.ghost.icon{padding:0;width:32px}
.ghost.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.ghost.primary:hover{background:var(--accent2)}
.ghost.soft{background:var(--accent-soft);color:var(--accent2);border-color:color-mix(in srgb,var(--accent) 25%,var(--line))}
.ghost[disabled]{opacity:.45;cursor:not-allowed}
.body{flex:1;min-height:0;overflow:auto;position:relative}
#listbody{padding:8px 8px 40px}
#stage,#tstage{padding:0}

/* ============ القائمة الجانبية ============ */
.search{position:relative;margin:10px 10px 6px}
.search svg{position:absolute;inset-inline-start:9px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{
  width:100%;height:38px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel);
  padding-inline:33px 30px;font-size:.88rem;
}
.search input::placeholder{color:var(--muted)}
.search .clr{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;color:var(--muted);display:none;align-items:center;justify-content:center}
.search .clr:hover{background:var(--line2)}
.search.has .clr{display:flex}
.chips{display:flex;gap:6px;padding:2px 10px 10px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.chip{
  font-size:.76rem;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);background:var(--panel);
  display:inline-flex;align-items:center;gap:5px;
}
.chip:hover{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.chip.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,var(--line));color:var(--accent2);font-weight:600}
.chip .n{font-size:.7rem;color:var(--muted);font-weight:400}
.country{border-bottom:1px solid var(--line2)}
.country>summary{
  list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 10px;font-size:.88rem;font-weight:600;
  border-radius:var(--r-sm);
}
.country>summary::-webkit-details-marker{display:none}
.country>summary:hover{background:var(--line2)}
.country .flag{font-size:1.05rem;line-height:1}
.country .cname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.country>.apad,.country>summary{text-align:start}
.country .num{font-size:.72rem;color:var(--muted);font-weight:500;background:var(--panel);border:1px solid var(--line);padding:1px 6px;border-radius:999px}
.country .caret{color:var(--muted);transition:transform .18s}
.country[open] .caret{transform:rotate(-90deg)}
.country .apad{padding:2px 4px 8px}
.paper{display:flex;align-items:center;gap:4px;border-radius:var(--r-sm);padding-inline-start:2px}
.paper:hover{background:var(--line2)}
.paper.active{background:var(--accent-soft)}
.paper.active .pname{color:var(--accent2)}
.plink{flex:1;min-width:0;display:flex;align-items:center;gap:7px;padding:7px 8px;text-align:start;border-radius:var(--r-sm)}
.pname{flex:1;min-width:0;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.dot.yes{background:var(--ok)} .dot.no{background:var(--warn)} .dot.unknown{background:var(--muted);opacity:.5}
.ltag{font-size:.66rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;letter-spacing:.4px;text-transform:uppercase;background:var(--panel)}
.ar-tag{font-size:.66rem;color:var(--accent2);background:var(--accent-soft);border-radius:4px;padding:0 4px;font-weight:700}
.mini{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:0 0 auto;opacity:0}
.paper:hover .mini,.mini.on{opacity:1}
.mini:hover{background:var(--panel);color:var(--accent)}
.mini.star.on{color:#d97706}
.noresult{padding:24px 14px;text-align:center;color:var(--muted);font-size:.85rem}
.sechead{padding:10px 10px 4px;font-size:.72rem;color:var(--muted);font-weight:700;letter-spacing:.4px}
.sidefoot{flex:0 0 auto;border-top:1px solid var(--line);padding:8px 12px;font-size:.74rem;color:var(--muted);background:var(--panel);display:flex;gap:6px;align-items:center}
@media (max-width:980px){.sidefoot{padding-bottom:64px}}

/* ============ نافذة العرض ============ */
#viewer .toolbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto;min-height:50px;flex-wrap:wrap}
.title{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.title .flag{font-size:1.1rem}
.title b{font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title .url{color:var(--muted);font-size:.75rem;direction:ltr;unicode-bidi:plaintext;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.state{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;padding:2px 8px;border-radius:999px;white-space:nowrap}
.state.yes{background:var(--ok-soft);color:var(--ok)} .state.no{background:var(--warn-soft);color:var(--warn)} .state.unknown{background:var(--line2);color:var(--muted)}
.frame-wrap{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--panel)}
.frame-bar{display:flex;align-items:center;gap:8px;padding:5px 10px;background:var(--panel2);border-bottom:1px solid var(--line2);font-size:.76rem;color:var(--muted);flex:0 0 auto;flex-wrap:wrap}
.frame-bar label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
iframe{flex:1;width:100%;border:0;background:#fff}
.card{
  margin:26px auto;max-width:560px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:22px 22px 20px;box-shadow:var(--shadow);
}
.card h3{margin:0 0 8px;font-size:1rem;display:flex;align-items:center;gap:8px}
.card p{margin:0 0 12px;color:var(--ink2);font-size:.88rem}
.card .row{display:flex;gap:8px;flex-wrap:wrap}
.kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:.78rem}
.emptywrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px}
.reader{padding:22px 26px 60px;max-width:760px;margin:0 auto}
.reader .rtitle{font-size:1.5rem;line-height:1.35;margin:0 0 6px;font-weight:700}
.reader .rmeta{color:var(--muted);font-size:.8rem;margin-bottom:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.reader .blk{margin:0 0 14px;font-size:var(--read);line-height:1.75;color:var(--ink)}
.reader .blk.h{font-weight:700;font-size:calc(var(--read) * 1.1);margin-top:22px}
.reader .blk.li{position:relative;padding-inline-start:16px}
.reader .blk.li::before{content:"•";position:absolute;inset-inline-start:2px;color:var(--accent)}
.reader[dir="ltr"]{font-family:Georgia,"Times New Roman",serif}
.reader[dir="rtl"]{font-family:var(--font-read)}
.reader[dir="rtl"] .rtitle{font-family:var(--font)}

/* ============ نافذة الترجمة ============ */
#tstage .reader{max-width:none;padding:18px 20px 70px}
.tmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:.76rem;border-bottom:1px dashed var(--line);padding-bottom:10px;margin-bottom:14px}
.tmeta .tag{background:var(--accent-soft);color:var(--accent2);border-radius:999px;padding:1px 8px;font-weight:600}
.tp{margin:0 0 16px;font-family:var(--font-read);font-size:calc(var(--read) * 1.0);line-height:2;color:var(--ink)}
.tp.h{font-weight:700;font-size:calc(var(--read) * 1.12);line-height:1.7;margin-top:24px;font-family:var(--font);color:var(--accent2)}
.orig{
  font-size:.82rem;line-height:1.6;color:var(--muted);border-inline-start:2px solid var(--line);
  padding:2px 10px 2px 0;margin:-8px 0 16px;direction:ltr;text-align:left;unicode-bidi:plaintext;font-family:Georgia,serif;
}
.prog{height:4px;background:var(--line2);border-radius:4px;overflow:hidden;margin:0 0 14px}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.spin{width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{margin:6px 0 18px}
.skel b{display:block;height:11px;border-radius:6px;background:linear-gradient(90deg,var(--line2),var(--line),var(--line2));background-size:200% 100%;animation:sh 1.3s linear infinite;margin-bottom:8px}
@keyframes sh{to{background-position:-200% 0}}
.toast{
  position:fixed;inset-block-end:18px;inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:var(--bg);
  padding:9px 16px;border-radius:999px;font-size:.84rem;box-shadow:var(--shadow);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s
}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(8,10,12,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:90}
.modal .card{margin:0;max-width:640px;max-height:82vh;overflow:auto}
.modal ul{margin:0 0 12px;padding-inline-start:20px;color:var(--ink2);font-size:.88rem}
.modal li{margin-bottom:7px}
#mtabs{display:none}
@media (max-width:980px){#sideBtn{display:none}.brand svg{width:22px;height:22px}}

/* ============ الجوال ============ */
@media (max-width:980px){
  #layout{flex-direction:column;direction:rtl !important}
  #sidebar{position:fixed;inset-block:56px 0;inset-inline-start:0;width:min(88vw,330px);flex-basis:auto;z-index:40;box-shadow:var(--shadow);transform:translateX(105%)}
  html[data-side="right"] #sidebar{inset-inline-start:auto;inset-inline-end:0;transform:translateX(-105%)}
  body.drawer #sidebar{transform:none}
  #scrim{position:fixed;inset:56px 0 0;background:rgba(8,10,12,.4);z-index:35;display:none}
  body.drawer #scrim{display:block}
  .split{display:none}
  #viewer,#trans{flex:1 1 auto;width:auto;border:0}
  #trans{display:none}
  body.tab-trans #viewer{display:none}
  body.tab-trans #trans{display:flex}
  #mtabs{display:flex;gap:6px;position:fixed;inset-block-end:14px;inset-inline-start:50%;transform:translateX(50%);z-index:45;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px;box-shadow:var(--shadow)}
  #mtabs .ghost{height:34px;border-radius:999px;padding:0 14px;font-size:.84rem}
  .brand small{display:none}
}
@media print{#topbar,#sidebar,.split,.toolbar,#mtabs{display:none !important}#trans{flex:1;display:block !important;border:0}}
</style>
</head>
<body>
<!-- ======================= الشريط العلوي ======================= -->
<header id="topbar">
  <button class="tbtn icon" id="menuBtn" aria-label="إظهار القائمة" title="إظهار/إخفاء القائمة">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.7 2.6 15.3 0 18M12 3c-2.6 2.7-2.6 15.3 0 18"/>
    </svg>
    <span><b>صحافة العالم</b><small>اقرأ صحف العالم، واقرأها بالعربية</small></span>
  </div>
  <div class="top-spacer"></div>
  <div id="srvbadge" title="حالة الوسيط المحلي"><span class="pulse" id="srvdot"></span><span id="srvtext">جارٍ الفحص…</span></div>
  <button class="tbtn icon" id="sideBtn" aria-label="تغيير جهة القائمة" title="جهة القائمة: يسار/يمين">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
  </button>
  <button class="tbtn icon" id="themeBtn" aria-label="الوضع الليلي" title="الوضع الليلي/النهاري">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/></svg>
  </button>
  <button class="tbtn icon" id="helpBtn" aria-label="مساعدة" title="كيف يعمل الموقع؟">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.4 2.3c-.6.3-.9.8-.9 1.5v.4"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>
  </button>
</header>

<!-- ======================= النوافذ الثلاث ======================= -->
<div id="layout">
  <!-- ① نافذة الروابط -->
  <aside id="sidebar" class="pane" aria-label="قائمة الصحف">
    <div class="search" id="searchwrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="ابحث عن صحيفة أو دولة…  (اضغط /)" aria-label="بحث">
      <button class="clr" id="qclr" aria-label="مسح البحث">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="chips" id="chips">
      <button class="chip on" data-f="free">مجانية بدون اشتراك <span class="n" id="n-free"></span></button>
      <button class="chip" data-f="embed">تُعرض مباشرة <span class="n" id="n-embed"></span></button>
      <button class="chip" data-f="all">كل المصادر <span class="n" id="n-all"></span></button>
      <button class="chip" data-f="fav">★ مفضلتي <span class="n" id="n-fav">0</span></button>
    </div>
    <div class="body" id="listbody"></div>
    <div class="sidefoot" id="sidefoot">
      <span id="sf-count"></span> · <button id="aboutLink" style="color:var(--accent)">عن الموقع</button>
    </div>
  </aside>
  <div class="split" id="split1" role="separator" aria-orientation="vertical" title="اسحب لتغيير العرض"></div>

  <!-- ② نافذة الموقع المختار -->
  <main id="viewer" class="pane" aria-label="نافذة الموقع">
    <div class="toolbar">
      <div class="title" id="vtitle">
        <b>لم تختر صحيفة بعد</b>
      </div>
      <span class="state unknown" id="vstate">—</span>
      <button class="ghost icon" id="modeBtn" title="تبديل: عرض الموقع المباشر / وضع القراءة النصي">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg>
      </button>
      <button class="ghost icon" id="reloadBtn" title="إعادة تحميل">

async function apiJSON(path, opt){
  const r = await fetch(path, Object.assign({cache:"no-store"}, opt||{}));
  const ct = r.headers.get("content-type")||"";
  if (!ct.includes("json")) throw new Error("استجابة غير متوقعة من الوسيط (HTTP " + r.status + ")");
  const j = await r.json();
  if (!j || j.ok === false) throw new Error((j && j.error) || ("فشل الطلب (HTTP " + r.status + ")"));
  return j;
}
async function getPage(url, opts={}){

  if (!fresh && PCACHE.has(url)) return PCACHE.get(url);

  if (S.server){

    catch(e){ data = await clientPage(url); data.warn = "تعذّر الجلب عبر الخادم: " + e.message; }
  } else {
    data = await clientPage(url);
  }
  data.url = url; PCACHE.set(url, data); return data;
}

/* --- مسار المتصفح المباشر (بدون خادم): عدة وسائط نصية بديلة --- */
async function clientPage(url){
  const errs = [];
  // 1) r.jina.ai : يعيد نص الصفحة
  try{
    const r = await fetch("https://r.jina.ai/" + url, {headers:{'x-respond-with':'markdown'}});
    if (r.ok){ const md = await r.text(); const p = parseMarkdown(md); if (p.blocks.length > 4) return p; errs.push("jina: نص قليل"); }
    else errs.push("jina: HTTP " + r.status);
  }catch(e){ errs.push("jina: " + e.message); }
  // 2) وسائط HTML بديلة (تعمل من أي متصفح)
  const prox = [
    u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
    u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u),
    u => "https://corsproxy.io/?" + encodeURIComponent(u)
  ];
  for (const mk of prox){
    try{
      const r = await fetch(mk(url), {signal: AbortSignal.timeout(12000)});
      if (!r.ok){ errs.push("proxy: HTTP " + r.status); continue; }
      const html = await r.text();
      const p = parseHTML(html, url);
      if (p.blocks.length > 4) return p;
      errs.push("HTML: نص قليل");
    }catch(e){ errs.push(e.message); }
  }
  throw new Error("لم نتمكن من جلب نص الصفحة. " + (errs.slice(0,3).join(" · ") || ""));
}
function parseMarkdown(md){
  const lines = String(md).split(/\r?\n/); const blocks = []; let title = "";
  for (let raw of lines){
    let l = raw.trim(); if (!l) continue;
    const tm = l.match(/^Title:\s*(.+)$/i); if (tm && !title){ title = tm[1].trim(); continue; }
    if (/^(URL Source|Markdown Content|Published Time|Warning):/i.test(l)) continue;
    if (/^!\[/.test(l)) continue;                       // صور
    l = l.replace(/\[!\[[^\]]*\]\([^)]*\)\]\([^)]*\)/g, "").replace(/!\[[^\]]*\]\([^)]*\)/g, "");
    const linkChars = (l.match(/\)\]\(/g)||[]).length;
    l = l.replace(/\[([^\]]*)\]\([^)]*\)/g, "$1").replace(/[*_`]{1,3}/g, "").replace(/\s+/g," ").trim();
    if (!l || l.length < 30 || ICONJUNK.test(l)) continue;
    if (linkChars >= 2 && l.length < 120) continue;     // سطر روابط (تنقّل)
    if (/^(الرئيسية|Home|Menu|Share|Read more|Subscribe|Sign in|Log in|Advertisement)/i.test(l)) continue;
    if (NAVJUNK.test(l)) continue;
    const h = /^#{1,3}\s+/.test(raw.trim());
    blocks.push({t: h ? "h" : "p", x: l.replace(/^#{1,6}\s*/, "")});
    if (blocks.length > 130) break;
  }
  return {ok:true, title, lang:"", blocks, via:"jina"};
}
const NAVJUNK = /^(skip to|jump to|saltar a|ir al contenido|passer au|aller au|zum inhalt|vai al|ga naar|пропустить|الانتقال إلى|تخطَّ إلى|تخطي إلى|اقفز إلى)/i;
const ICONJUNK = /(?:[a-z]{8,}[-_]?){3,}/i;      // تسرّب أسماء أيقونات الخطوط
function dedupText(t){
  const n = t.length;
  if (n < 8) return t;
  for (const size of [Math.floor(n/2), Math.floor(n/3)]){
    if (size < 4 || n % size) continue;
    const piece = t.slice(0, size);
    if (piece.repeat(n / size) === t) return piece;
  }
  return t;
}
function parseHTML(html, url){
  const doc = new DOMParser().parseFromString(html, "text/html");
  doc.querySelectorAll("svg title, symbol title, use title").forEach(n=>n.remove());
  doc.querySelectorAll("script,style,noscript,svg,form,iframe,header,footer,nav,aside").forEach(n=>n.remove());
  const title = (doc.querySelector('meta[property="og:title"]')||{}).content
              || (doc.querySelector("title")||{}).textContent || "";
  const lang = (doc.documentElement.getAttribute("lang")||"").slice(0,2).toLowerCase();
  const scope = doc.querySelector("article") || doc.querySelector("main") || doc.body;
  const blocks = []; const seen = new Set();
  scope.querySelectorAll("h1,h2,h3,p,blockquote,li").forEach(el=>{
    const txt = (el.textContent||"").replace(/\s+/g," ").trim();
    if (!txt || txt.length < 28 || NAVJUNK.test(txt) || ICONJUNK.test(txt)) return;
    if (el.querySelectorAll("a").length > 3 && txt.length < 160) return;   // سطر قوائم
    const clean = dedupText(txt);
    const key = clean.slice(0,60); if (seen.has(key)) return; seen.add(key);
    const tag = el.tagName.toLowerCase();
    txt = txt.replace(/\b\d+\s*(?:mins?|minutes?|hrs?|hours?)\s+ago\b/gi, "").replace(/\s+/g," ").trim();
    blocks.push({t: (tag==="h1"||tag==="h2"||tag==="h3") ? "h" : (tag==="li" ? "li" : "p"), x: clean});
  });
  return {ok:true, title: title.trim(), lang, blocks: blocks.slice(0,130), via:"html"};
}

/* =========================================================================
   الترجمة: عبر الخادم إن وُجد، وإلا مباشرةً عبر خدمات تدعم CORS
   ========================================================================= */
async function translateBatch(texts, sl){
  const src = (sl && /^[a-z]{2}$/.test(sl) && sl !== "ar") ? sl : "auto";
  if (S.server){
    try{
      const j = await apiJSON("api/translate", {method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({texts, sl:src, tl:"ar"})});
      return j.out.map(o=>o.ar);
    }catch(e){ /* ننتقل للمسار المباشر */ }
  }
  try{ return await googleDirect(texts, src); }
  catch(e){ return await mymemory(texts, src); }
}
async function googleDirect(texts, sl){
  const body = new URLSearchParams(); texts.forEach(t=>body.append("q", t));
  const r = await fetch("https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=" + sl + "&tl=ar",
                        {method:"POST", body});
  if (!r.ok) throw new Error("google HTTP " + r.status);
  const j = await r.json();
  const n = texts.length;
  const fit = a => { if (a.length === n + 1 && /^[a-z\-]{2,8}$/i.test((a[n]||"").trim())) a = a.slice(0,n);
                     while (a.length < n) a.push(""); return a.slice(0,n); };
  if (typeof j === "string") return Array(n).fill(j);
  if (!Array.isArray(j) || !j.length) throw new Error("بنية استجابة غير متوقعة");
  if (Array.isArray(j[0])) return fit(j.map(x => Array.isArray(x) ? (x[0]||"") : String(x||"")));
  const flat = j.map(x => String(x));
  if (n === 1) return [flat[0] || ""];
  return fit(flat);
}
async function mymemory(texts, sl){
  const src = sl === "auto" ? "en" : sl; const out = [];
  for (const t of texts){
    const chunk = t.length > 480 ? t.slice(0,480) : t;
    const r = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(chunk) +
                          "&langpair=" + src + "|ar&de=press@example.com");
    const j = await r.json();
    if (j.quotaFinished) throw new Error("انتهت حصة خدمة الترجمة البديلة لهذا اليوم.");
    out.push((j.responseData && j.responseData.translatedText) || "");
  }
  return out;
}
const runLimit = async (tasks, n) => {
  const q = tasks.slice(); const run = async () => { while (q.length){ const t = q.shift(); try{ await t(); }catch(e){ throw e; } } };
  await Promise.all(Array.from({length: Math.min(n, tasks.length)}, run));
};

  const useProxy = S.server && (p.e !== "yes" || S.forceProxy);
  if (!S.server && p.e !== "yes"){
    stage.innerHTML = `<div class="emptywrap"><div class="card">
      <h3>⚠︎ هذا الموقع يمنع العرض داخل نوافذ المواقع الأخرى</h3>
      <p><b>${esc(p.n)}</b> يرسل ترويسة أمنية (<span dir="ltr">X-Frame-Options</span>) تمنع تضمين صفحته. لديك ثلاثة حلول فورية:</p>
      <div class="row">
        <button class="ghost primary" id="a">📖 وضع القراءة النصي</button>
        <a class="ghost" href="${esc(p.u)}" target="_blank" rel="noopener noreferrer">↗ فتح في تبويب جديد</a>
        <button class="ghost" id="b">جرّب العرض المباشر على أي حال</button>
      </div>
      <p style="margin-top:14px;color:var(--muted);font-size:.82rem">نصيحة: شغّل الخادم المرفق <span class="kbd" dir="ltr">python3 server.py</span> وسيعرض الموقع الصفحة عبر وسيط محلي يتجاوز هذا المنع تلقائيًا.</p>
    </div></div>`;
    $("#a").onclick = ()=>{ S.mode="read"; save(); renderViewer(); };
    $("#b").onclick = ()=>{ S.forceProxy="try"; renderLiveTry(); };
    return;
  }
  const src = useProxy ? ("api/view?url=" + encodeURIComponent(p.u) + (S.compat ? "&js=1" : "")) : p.u;
  const sbx = useProxy
    ? (S.compat ? "allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals"
                : "allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals")
    : "allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads";
  stage.innerHTML = `<div class="frame-wrap">
    <div class="frame-bar">
      ${useProxy ? `<span>عرض عبر الوسيط المحلي — قد تختلف بعض العناصر (القوائم التفاعلية، الفيديو) عن الأصل.</span>
        <label title="يمنح الصفحة صلاحية الوصول لذاكرة هذا الموقع — استخدمه فقط إذا لم تظهر الصفحة"><input type="checkbox" id="cmp" ${S.compat?"checked":""}> وضع التوافق</label>
        <button class="ghost" id="direct" style="height:26px;font-size:.74rem">عرض مباشر بدل الوسيط</button>`
      : `<span>عرض مباشر للصفحة الأصلية. إن بقيت فارغة فالموقع تغيّر إعداده الأمني — استخدم «وضع القراءة».</span>`}
      <span style="flex:1"></span><span dir="ltr">${esc(hostOf(p.u))}</span>
    </div>
    <iframe src="${esc(src)}" ${useProxy?`sandbox="${sbx}"`:""} referrerpolicy="no-referrer" loading="eager"
      title="${esc(p.n)}" allow="clipboard-read; clipboard-write"></iframe>
  </div>`;
  const cmp = $("#cmp"); if (cmp) cmp.onchange = ()=>{ S.compat = cmp.checked; save(); renderLive(); };
  const d = $("#direct"); if (d) d.onclick = ()=>{ S.forceProxy = false; renderLive(); };
}

}
function setProgress(done, total){
  const bar = $("#tprog i"); if (bar) bar.style.width = Math.round(done*100/Math.max(total,1)) + "%";
  const lbl = $("#tpnum"); if (lbl) lbl.textContent = `${done} / ${total}`;
}

/* ---------- خط الأنابيب: جلب + ترجمة مع تقدّم مباشر ---------- */
async function translatePage(fresh, opts={}){
  const p = S.sel; if (!p) return;
  const official = !!(opts.asOriginal && p.a);
  const url = official ? p.a : p.u;
  const key = (official ? "off:" : "tr:") + url;
  const hit = TCACHE.get(key);
  if (hit && !fresh){ S.lastResult = hit; S.tstate = "done"; renderTrans(); return; }
  S.tstate = "loading"; S.lastResult = null; renderTrans();
  const setPhase = t => { const el = $("#tphase"); if (el) el.textContent = t; };
  try{
    setPhase(official ? "جارٍ جلب النسخة العربية الرسمية…" : "جارٍ جلب نص الصفحة…");
    const page = await getPage(url, {fresh});
    let blocks = (page.blocks || []).filter(b => b.x && b.x.length > 2);
    if (!blocks.length) throw new Error("لم يُعثر على نص قابل للقراءة في هذه الصفحة (ربما تعتمد على جافاسكربت أو تحجب الجلب الآلي).");
    let truncated = false;
    if (blocks.length > 110){ blocks = blocks.slice(0, 110); truncated = true; }
    const sample = blocks.slice(0, 8).map(b => b.x).join(" ");
    const fromArabic = official || isArabicText(sample) || String(page.lang || "").startsWith("ar");
    let result;
    if (fromArabic){
      result = {title: page.title || p.n, lang: "ar", blocks, ar: null, fromArabic: true,
                n: blocks.length, url, truncated, at: Date.now()};
    } else {
      const srcLang = (page.lang && /^[a-z]{2}$/.test(page.lang) && page.lang !== "ar") ? page.lang : "auto";
      const texts = blocks.map(b => b.x);
      const out = new Array(texts.length);
      const CH = S.server ? 16 : 10;
      const batches = [];
      for (let i = 0; i < texts.length; i += CH){
        const idx = []; for (let k = i; k < Math.min(i + CH, texts.length); k++) idx.push(k);
        batches.push(idx);
      }
      let done = 0; setPhase("جارٍ الترجمة إلى العربية…"); setProgress(0, texts.length);
      await runLimit(batches.map(idx => async () => {
        const res = await translateBatch(idx.map(k => texts[k]), srcLang);
        res.forEach((ar, j) => { out[idx[j]] = ar; });
        done += idx.length; setProgress(done, texts.length);
      }), S.server ? 3 : 2);
      result = {title: page.title || p.n, lang: srcLang, blocks, ar: out, fromArabic: false,
                n: texts.length, url, truncated, at: Date.now()};
    }
    TCACHE.set(key, result); S.lastResult = result; S.tstate = "done"; renderTrans();
    if (truncated) toast("عُرضت أول ١١٠ فقرات من الصفحة.");
  }catch(err){
    S.tstate = "error"; S.error = err.message || String(err); renderTrans();
  }
}

addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (e.key === "/" && !typing){ e.preventDefault(); $("#q").focus(); $("#q").select(); }
  else if (e.key === "Escape"){ document.body.classList.remove("drawer"); const m = $(".modal"); if (m) m.remove(); }
  else if ((e.key === "t" || e.key === "T") && !typing && !e.ctrlKey && !e.metaKey){ if (S.sel) translatePage(S.tstate === "done"); }
  else if ((e.key === "b" || e.key === "B") && !typing && !e.ctrlKey && !e.metaKey){ $("#biBtn").click(); }
});
/* سحب الفواصل لتغيير عرض النوافذ */
function dragSplit(el, which){
  el.addEventListener("pointerdown", e => {
    if (window.innerWidth <= 980) return;
    e.preventDefault(); el.classList.add("drag"); el.setPointerCapture(e.pointerId);
    const x0 = e.clientX, w0 = S.widths[which], side = S.side;
    const move = ev => {
      const dx = ev.clientX - x0;
      let w = which === "sb" ? w0 + (side === "left" ? dx : -dx) : w0 - dx;
      const cap = which === "sb" ? window.innerWidth * .42 : window.innerWidth * .62;
      w = Math.min(Math.max(w, which === "sb" ? 225 : 300), Math.max(280, cap));
      S.widths[which] = Math.round(w); applyWidths();
    };
    const up = () => { el.classList.remove("drag");
      el.removeEventListener("pointermove", move); el.removeEventListener("pointerup", up); save(); };
    el.addEventListener("pointermove", move); el.addEventListener("pointerup", up);
  });
  el.addEventListener("dblclick", () => { S.widths[which] = which === "sb" ? 290 : 470; applyWidths(); save(); });
}
dragSplit($("#split1"), "sb"); dragSplit($("#split2"), "tr");

async function detectServer(){
  try{
    const r = await fetch("api/health", {cache:"no-store"});
    const j = await r.json(); S.server = !!j.ok;
  }catch(e){ S.server = false; }
  $("#srvdot").classList.toggle("on", S.server);

    ? "متصّل بخادم server.py: التضمين عبر الوسيط والجلب والترجمة تعمل من الخادم."
    : "لم يُعثر على server.py — شغّله بالأمر python3 server.py للحصول على أفضل أداء.";
}
